[pytest]

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    e2e: end-to-end browser tests
    force_login: tests that perform an explicit login
    smoke: smoke tests

# Default execution options
addopts = -v



;# Run all tests
;pytest
;
;# Run all tests with detailed output ( v means verbose )
;pytest -v
;
;# Run all tests with 2 workers
;pytest -v -n 2
;
;# Run only smoke tests
;pytest -v -m smoke
;
;# Run only E2E tests
;pytest -v -m e2e
;
;# Run E2E tests with 2 workers
;pytest -v -n 2 -m e2e
;
;# Run only login test
;pytest -v tests/test_login.py
;
;# Run only interview scheduling test
;pytest -v tests/test_dashboard.py::TestDashboard::test_schedule_interview

;
;-v(verbose) -> Displays detailed test execution results
;-n 2(num of workers) -> Runs tests in parallel using 2 workers
;-m e2e(marker) -> Runs only tests marked with the "e2e" marker