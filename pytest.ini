[pytest]

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

addopts = -v -s --alluredir=allure-results --clean-alluredir

markers =
    smoke: Smoke test cases
    regression: Regression test cases
    sanity: Sanity test cases
    negative: Negative test scenarios
    edge: Edge case scenarios
    e2e: End-to-end test scenarios
    force_login: Always create a clean browser context and authenticate

#This file will work similarly to how we use testng.xml and Maven configuration in Java, although Pytest discovers tests differently.
